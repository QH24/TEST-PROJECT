<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lip Balm Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--red:#ff2d55;--yellow:#ffd60a;--cream:#f5f0e8;--teal:#00e5cc;--orange:#ff6b35;--purple:#c084fc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg) radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/20px 20px;color:var(--cream);font-family:'Space Grotesk',system-ui,sans-serif;max-width:480px;margin:0 auto;padding:28px 20px 60px;min-height:100vh}
h1,h2{font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-weight:400}
h1{font-size:64px;line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--red),7px 7px 0 #000;margin-bottom:24px}
h2{font-size:30px;color:var(--yellow);text-shadow:3px 3px 0 var(--red);margin:18px 0 14px}
button{display:block;width:100%;margin:10px 0;padding:14px 16px;font:400 20px 'Bebas Neue',sans-serif;letter-spacing:.1em;border:3px solid #000;background:var(--yellow);color:#000;box-shadow:4px 4px 0 #000;cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s}
button:nth-of-type(2n){background:var(--teal)}button:nth-of-type(3n){background:var(--orange)}
button:active{transform:translateY(2px) scale(.98);box-shadow:1px 1px 0 #000}
.card{background:var(--cream);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:16px;margin:14px 0;transform:rotate(-.5deg)}
.card:nth-child(odd){transform:rotate(.5deg)}.card b{font:400 22px 'Bebas Neue',sans-serif;letter-spacing:.06em}
.card img{border:3px solid #000;margin-top:8px}
a.cta{display:inline-block;margin-top:10px;padding:10px 18px;background:var(--red);color:#fff;border:3px solid #000;box-shadow:3px 3px 0 #000;text-decoration:none;font:400 18px 'Bebas Neue',sans-serif;letter-spacing:.12em}
.bar{height:8px;background:rgba(255,255,255,.1);border:2px solid #000}.bar i{display:block;height:100%;background:var(--red)}
</style></head><body>
<h1>FIND YOUR MELTIE</h1><div id="app"></div>

<!-- Questions: each answer adds +1 to every product tag it lists. Edit freely. -->
<script id="questions" type="application/json">
[
 {"q":"What's your main lip concern?","a":[
  {"t":"Dry & chapped","tags":["hydrating","repair"]},
  {"t":"Dull / dark lips","tags":["brightening"]},
  {"t":"Sun exposure","tags":["spf"]},
  {"t":"Just want colour","tags":["tint"]}]},
 {"q":"Want a hint of colour?","a":[
  {"t":"Yes, tinted","tags":["tint"]},
  {"t":"No, clear please","tags":["clear"]}]},
 {"q":"Do you need SPF?","a":[
  {"t":"Yes, daily protection","tags":["spf"]},
  {"t":"Not necessary","tags":["hydrating"]}]},
 {"q":"Pick a flavour vibe","a":[
  {"t":"Fruity","tags":["fruity"]},
  {"t":"Sweet / dessert","tags":["sweet"]},
  {"t":"Fresh / minty","tags":["fresh"]}]}
]
</script>

<!-- Products: PLACEHOLDERS. dotandkey.com returned 429 to automated clients, so replace
     with real data from /collections/lip-balms/products.json (title, url, image). -->
<script id="products" type="application/json">
[
 {"name":"Meltie Lip Balm – Strawberry (placeholder)","url":"https://www.dotandkey.com/collections/lip-balms","image":"","tags":["hydrating","tint","fruity","repair"]},
 {"name":"Meltie Lip Balm – Vanilla (placeholder)","url":"https://www.dotandkey.com/collections/lip-balms","image":"","tags":["hydrating","clear","sweet","repair"]},
 {"name":"Meltie Lip Balm SPF (placeholder)","url":"https://www.dotandkey.com/collections/lip-balms","image":"","tags":["spf","clear","fresh","hydrating"]},
 {"name":"Meltie Tinted Lip Balm (placeholder)","url":"https://www.dotandkey.com/collections/lip-balms","image":"","tags":["tint","brightening","sweet","fruity"]}
]
</script>

<script>
const Q=JSON.parse(document.getElementById('questions').textContent),
      P=JSON.parse(document.getElementById('products').textContent),
      app=document.getElementById('app'),score={};
let i=0;
function show(){
  if(i>=Q.length) return result();
  const q=Q[i];
  app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${q.q}</h2>`;
  q.a.forEach(a=>{const b=document.createElement('button');b.textContent=a.t;
    b.onclick=()=>{a.tags.forEach(t=>score[t]=(score[t]||0)+1);i++;show()};app.appendChild(b)});
}
function result(){
  const r=P.map(p=>({...p,s:p.tags.reduce((n,t)=>n+(score[t]||0),0)})).sort((a,b)=>b.s-a.s);
  app.innerHTML='<h2>Your match</h2>'+r.map((p,k)=>`<div class="card"><b>${k?'':'★ Best: '}${p.name}</b>
    ${p.image?`<br><img src="${p.image}" width="120">`:''}<br><a class="cta" href="${p.url}" target="_blank" rel="noopener">Shop</a></div>`).join('')+
    '<button onclick="location.reload()">Retake</button>';
}
show();
</script></body></html>
